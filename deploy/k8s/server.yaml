# Server mode inside the cluster. A git-sync sidecar keeps a checkout of the manifest repo
# up to date; the detector checks it every 5 minutes and exposes Prometheus metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: drift-detector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drift-detector
  namespace: drift-detector
  labels:
    app.kubernetes.io/name: drift-detector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drift-detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drift-detector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: drift-detector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65533
        fsGroup: 65533
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=https://github.com/yashringe/gitops-drift-detector
            - --ref=main
            - --root=/git
            - --link=current
            - --period=60s
          volumeMounts:
            - name: git
              mountPath: /git
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
        - name: detector
          image: ghcr.io/yashringe/gitops-drift-detector:latest
          args:
            - --spring.profiles.active=server
            - --drift.manifests=/git/current/examples/k8s
            - --drift.managed-by-label=app.kubernetes.io/managed-by=gitops
            - --drift.interval=5m
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: git
              mountPath: /git
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: git
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: drift-detector
  namespace: drift-detector
spec:
  selector:
    app.kubernetes.io/name: drift-detector
  ports:
    - name: http
      port: 8080
      targetPort: http
