# kubectl-style List wrapper plus an empty document and a Secret written with stringData
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: reporter
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: drift-reader
    rules:
      - apiGroups: [""]
        resources: [configmaps]
        verbs: [get, list]
---
---
apiVersion: v1
kind: Secret
metadata:
  name: api-token
  namespace: demo
type: Opaque
stringData:
  token: s3cr3t
